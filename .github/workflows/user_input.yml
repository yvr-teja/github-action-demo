name: Testing User Input Workflow

on:
  workflow_dispatch:
    inputs:
      number1:
        description: 'First Number'
        default: '0'
        required: true
        type: number

      number2:
        description: 'Second Number'
        default: '0'
        required: true
        type: number

jobs:
  add_numbers:
    runs-on: ubuntu-latest
    steps:
      - name: Add numbers
        id: sum
        shell: bash
        run: |
          sum=$(( ${{ inputs.number1 }} + ${{ inputs.number2 }} ))
          echo "sum=$sum" 

      - name: Display sum
        run: echo "The sum of ${{ inputs.number1 }} and ${{ inputs.number2 }} is ${{ steps.sum.outputs.sum }}"
